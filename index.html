    <!-- Fila de anúncios e medição — sai do caminho crítico
         =====================================================
         Medido num Redmi 9A (Android 11, Chrome 151, 2 GB, CPU de 32 bits),
         tempo até o botão JOGAR do emulador aparecer:

           cache frio, com estes scripts no caminho crítico ... 7.352 ms
           cache frio, com eles fora ......................... 1.979 ms
           cache quente, dentro .............................. 5.565 ms
           cache quente, fora ................................ 1.570 ms

         São 3,7x. Não se remove anúncio nenhum aqui: eles apenas param de
         disputar CPU e rede com o download e a descompactação do core, que
         é 1,15 MB de 7z extraído em JavaScript. A impressão continua
         acontecendo — o visitante segue na página, jogando.

         Toda tag abaixo se inscreve por `aoLiberarAnuncios`. Há teto de
         tempo: se nada disparar, carrega assim mesmo. Falha aqui é receita
         perdida, então o caminho de segurança é obrigatório. -->
    <script>
      (function () {
        var jaLiberou = false;
        var fila = [];

        window.aoLiberarAnuncios = function (fn) {
          if (jaLiberou) fn();
          else fila.push(fn);
        };

        function liberar() {
          if (jaLiberou) return;
          jaLiberou = true;
          for (var i = 0; i < fila.length; i++) {
            try {
              fila[i]();
            } catch (e) {
              /* uma tag que quebra não pode derrubar as outras */
            }
          }
          fila.length = 0;
        }
        window.liberarAnuncios = liberar;

        var naSalaDeJogo = /^\/jogar\//.test(location.pathname);

        if (naSalaDeJogo) {
          // O app avisa quando o emulador terminou de montar.
          window.addEventListener('assopra:emulador-pronto', liberar, { once: true });
        } else {
          window.addEventListener(
            'load',
            function () {
              setTimeout(liberar, 800);
            },
            { once: true }
          );
        }

        // Teto: rede ruim, erro no app, rota inesperada — carrega do mesmo jeito.
        setTimeout(liberar, naSalaDeJogo ? 12000 : 4000);
      })();
    </script>

        g.async = true;

        document.head.appendChild(g);

      googletag.cmd.push(function () {

          '/23340104016/assoprafitas.com/content1',
          [[250, 250], [300, 250], [336, 280]],
          'div-gpt-ad-1775680124469-0'
        ).addService(googletag.pubads());

        googletag.defineSlot(
          '/23340104016/assoprafitas.com/content2',
          [[250, 250], [300, 250], [336, 280]],
          'div-gpt-ad-1775680168607-0'
        ).addService(googletag.pubads());

        googletag.enableServices();

        }
