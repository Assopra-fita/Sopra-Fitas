    <meta charset="UTF-8" />

    <!-- Fila de anúncios e medição — sai do caminho crítico
         =====================================================
         Medido num Redmi 9A (Android 11, Chrome 151, 2 GB, CPU de 32 bits),
         tempo até o botão JOGAR do emulador aparecer:

           cache frio, com estes scripts no caminho crítico ... 7.352 ms
           cache frio, com eles fora ......................... 1.979 ms
           cache quente, dentro .............................. 5.565 ms
           cache quente, fora ................................ 1.570 ms

         São 3,7x. Não se remove anúncio nenhum aqui: eles apenas param de
         disputar CPU e rede com o download e a descompactação do core, que
         é 1,15 MB de 7z extraído em JavaScript. A impressão continua
         acontecendo — o visitante segue na página, jogando.

         São DUAS filas, e a divisão importa:

           `aoCarregarGPT`      — só o gpt.js e a definição dos slots. Na sala
                                  de jogo ela abre no DOMContentLoaded, cedo.
           `aoLiberarAnuncios`  — o peso de verdade: GTM, Pixel, os banners de
                                  300x250 e o interstitial. Continua esperando
                                  o emulador montar.

         Por que o gpt.js saiu da fila pesada na sala de jogo: o anúncio
         premiado do botão JOGAR precisa estar CARREGADO no instante do clique,
         e quem chega pelo Google direto numa página de jogo não passou pela
         Home para aquecer nada. Esperando o emulador montar, o pedido do
         premiado saía junto com o botão aparecendo — tarde demais.

         O que entra cedo é o script e um pedido de anúncio out-of-page. Nenhum
         criativo é desenhado aqui: banner e interstitial continuam na fila
         pesada. Se o tempo até o botão JOGAR regredir no aparelho, a volta é
         uma linha — mover `filaGPT.abrir` para junto do `filaPesada.abrir`.

         Há teto de tempo nas duas: se nada disparar, carrega assim mesmo.
         Falha aqui é receita perdida, então o caminho de segurança é
         obrigatório. -->
    <script>
      (function () {
        function criarFila() {
          var aberta = false;
          var espera = [];

          return {
            entrar: function (fn) {
              if (aberta) fn();
              else espera.push(fn);
            },
            abrir: function () {
              if (aberta) return;
              aberta = true;
              for (var i = 0; i < espera.length; i++) {
                try {
                  espera[i]();
                } catch (e) {
                  /* uma tag que quebra não pode derrubar as outras */
                }
              }
              espera.length = 0;
            },
          };
        }

        var filaGPT = criarFila();
        var filaPesada = criarFila();

        window.aoCarregarGPT = filaGPT.entrar;
        window.aoLiberarAnuncios = filaPesada.entrar;
        window.liberarAnuncios = function () {
          filaGPT.abrir();
          filaPesada.abrir();
        };

        var naSalaDeJogo = /^\/jogar\//.test(location.pathname);

        if (naSalaDeJogo) {
          // Os bundles do app já executaram (script de módulo roda antes do
          // DOMContentLoaded), então o gpt.js não disputa com eles. Daqui até o
          // clique no JOGAR são os segundos que o premiado tem para carregar.
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', filaGPT.abrir, {
              once: true,
            });
          } else {
            filaGPT.abrir();
          }

          // O app avisa quando o emulador terminou de montar.
          window.addEventListener('assopra:emulador-pronto', filaPesada.abrir, {
            once: true,
          });
        } else {
          window.addEventListener(
            'load',
            function () {
              setTimeout(function () {
                filaGPT.abrir();
                filaPesada.abrir();
              }, 800);
            },
            { once: true }
          );
        }

        // Teto: rede ruim, erro no app, rota inesperada — carrega do mesmo jeito.
        setTimeout(filaGPT.abrir, 4000);
        setTimeout(filaPesada.abrir, naSalaDeJogo ? 12000 : 4000);
      })();
    </script>

    <!-- O gpt.js passa a ser injetado pela fila, e não por uma tag no HTML:
         `async` só promete não bloquear o parser, e ele continuava competindo
         pela rede e pela CPU junto com o core do emulador.

         Definir slot não pede anúncio nenhum — quem pede é o `display`. Por
         isso as definições e o `enableServices` ficam na fila leve, e os
         `display` de banner e interstitial continuam na pesada. -->
    <script>
      window.googletag = window.googletag || { cmd: [] };

      aoCarregarGPT(function () {
        var g = document.createElement('script');
        g.async = true;
        g.crossOrigin = 'anonymous';
        g.src = 'https://securepubads.g.doubleclick.net/tag/js/gpt.js';
        document.head.appendChild(g);
      });

      var interstitialSlot = null;

      googletag.cmd.push(function () {
        // A lista aqui é o PEDIDO, não a permissão: quem decide o que pode
        // servir é a configuração do bloco no painel do Ad Manager, mais os
        // itens de linha ligados a ele. Medido pedindo cada tamanho sozinho
        // nestas duas unidades: 336x280 preencheu 4 de 12; 300x250, 0 de 8;
        // 160x600, 0 de 8; e pedindo SÓ 300x600 o painel devolveu um 336x280,
        // que é a prova de que o limite não está deste lado.
        //
        // Então acrescentar tamanho aqui é de graça e não muda nada sozinho —
        // mas TIRAR tamanho apaga anúncio, e já apagou uma vez. Regra: só mexer
        // nesta lista com medição na mão.
        //
        // 300x600 (meia página) fica só no desktop de três colunas. É o formato
        // vertical de maior valor e a coluna lateral tem altura para ele; no
        // layout empilhado ele ficaria entre o jogo e o rodapé, empurrando a
        // página inteira para baixo quando carregasse.
        var mapaDaLateral = googletag
          .sizeMapping()
          .addSize([1200, 0], [[336, 280], [300, 600], [300, 250], [250, 250]])
          .addSize([336, 0], [[336, 280], [300, 250], [250, 250]])
          .addSize([0, 0], [[300, 250], [250, 250]])
          .build();

        googletag.defineSlot(
          '/23340104016/assoprafitas.com/content1',
          [[250, 250], [300, 250], [336, 280], [300, 600]],
          'div-gpt-ad-1775680124469-0'
        ).defineSizeMapping(mapaDaLateral).addService(googletag.pubads());

        googletag.defineSlot(
          '/23340104016/assoprafitas.com/content2',
          [[250, 250], [300, 250], [336, 280], [300, 600]],
          'div-gpt-ad-1775680168607-0'
        ).defineSizeMapping(mapaDaLateral).addService(googletag.pubads());

        interstitialSlot = googletag.defineOutOfPageSlot(
          '/23340104016/assoprafitas.com/interstitial',
          googletag.enums.OutOfPageFormat.INTERSTITIAL
        );

        if (interstitialSlot) {
          interstitialSlot.addService(googletag.pubads());
        }

        googletag.pubads().enableSingleRequest();
        googletag.enableServices();
      });

      aoLiberarAnuncios(function () {
        googletag.cmd.push(function () {
          if (interstitialSlot) {
            googletag.display(interstitialSlot);
          }
        });
      });
    </script>
